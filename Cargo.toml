[package]
name = "rustdesk-display-cli"
version = "0.1.0"
edition = "2021"
description = "Apply Windows display profiles for smoother RustDesk remote sessions"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.30"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
